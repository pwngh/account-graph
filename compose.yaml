# The server and its database, for trying it out:
#   docker compose up --build
# Change the two tokens, LINK_SECRET, IDENTIFIER_SECRET and RECEIPT_SECRETS before anything real touches it. GRAPH_PORT moves it off 8080.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: graph
      POSTGRES_DB: graph
    volumes:
      - graph-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d graph']
      interval: 3s
      timeout: 3s
      retries: 20

  graph:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${GRAPH_PORT:-8080}:8080'
    environment:
      DATABASE_URL: postgres://postgres:graph@postgres:5432/graph
      SERVICE_TOKENS: ${SERVICE_TOKENS:-[]}
      LEADS:
      GRAPH_TOKEN: ${GRAPH_TOKEN:-change-me-service-token}
      RECEIPT_SECRETS: ${RECEIPT_SECRETS:-change-me-receipt-secret-change-me}
      # The people who review, each with a token of their own.
      REVIEW_TOKENS: ${REVIEW_TOKENS:-{"reviewer":"change-me-review-token"}}
      # What differs from the default policy, as JSON.
      POLICY: ${POLICY:-}
      # The sites whose pages may report visits. The example site answers on these two.
      ORIGINS: ${ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ALLOW_PAGES:
      REFUSE_PAGES:
      # What the example site needs to show page events, a call tied to a tap, and signed links.
      EVENTS: ${EVENTS:-brochure,phone_click}
      CALL_NUMBERS: ${CALL_NUMBERS:-{"+15551230001":{"source":"google","campaignId":"20222"}}}
      CALL_RESULTS: ${CALL_RESULTS:-}
      CALL_RESULT_WAIT: ${CALL_RESULT_WAIT:-30}
      OPEN_HOURS: ${OPEN_HOURS:-}
      POOL_NUMBERS: ${POOL_NUMBERS:-}
      POOL_MINUTES: ${POOL_MINUTES:-15}
      POOL_GRACE_MINUTES: ${POOL_GRACE_MINUTES:-120}
      POOL_REQUIRE_TAP_AFTER_REASSIGNMENT: ${POOL_REQUIRE_TAP_AFTER_REASSIGNMENT:-false}
      IDENTIFIER_SECRET: ${IDENTIFIER_SECRET:-change-me-identifier-secret-change-me}
      LINK_SECRET: ${LINK_SECRET:-change-me-link-secret-change-me-now}
      # Every other setting in docs/operations.md, passed through when you set it. Unset, each is off.
      REPORT_TIME_ZONE: ${REPORT_TIME_ZONE:-}
      STAGES: ${STAGES:-}
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
      AUDIT_HEAD_HOURS: ${AUDIT_HEAD_HOURS:-0}
      QUIET_TOUCHES_HOURS: ${QUIET_TOUCHES_HOURS:-0}
      QUIET_CALLS_HOURS: ${QUIET_CALLS_HOURS:-0}
      QUIET_RESULTS_HOURS: ${QUIET_RESULTS_HOURS:-0}
      QUIET_COSTS_HOURS: ${QUIET_COSTS_HOURS:-0}
      RETURN_HOURS: ${RETURN_HOURS:-24}
      LATE_HOURS: ${LATE_HOURS:-6}
      STAFF_NETWORKS: ${STAFF_NETWORKS:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      COOKIE: ${COOKIE:-}
      RATE_PER_MINUTE: ${RATE_PER_MINUTE:-}
      RATE_BURST: ${RATE_BURST:-}
      RATE_LIMIT: ${RATE_LIMIT:-}
      OUTBOX_DELAY_MS: ${OUTBOX_DELAY_MS:-}
      FORGET_ADS: ${FORGET_ADS:-}
      CALL_MIN_SECONDS: ${CALL_MIN_SECONDS:-}
      CALL_TAP_SECONDS: ${CALL_TAP_SECONDS:-}
      CALL_EXCLUDE: ${CALL_EXCLUDE:-}
      FINGERPRINT_SECRET: ${FINGERPRINT_SECRET:-}
      FINGERPRINT_REGION: ${FINGERPRINT_REGION:-}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      MAXMIND_SERVICE: ${MAXMIND_SERVICE:-}
      MAXMIND_HOST: ${MAXMIND_HOST:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL:-}
      TWILIO_TEXT_WEBHOOK_URL: ${TWILIO_TEXT_WEBHOOK_URL:-}
      TEXT_CODES: ${TEXT_CODES:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      SMARTY_AUTH_ID: ${SMARTY_AUTH_ID:-}
      SMARTY_AUTH_TOKEN: ${SMARTY_AUTH_TOKEN:-}
      SMARTY_LICENSE: ${SMARTY_LICENSE:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_ADS_COSTS: ${GOOGLE_ADS_COSTS:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_CONVERSIONS: ${GOOGLE_ADS_CONVERSIONS:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_SITE_URL: ${META_SITE_URL:-}
      META_CLIENT_USER_AGENT: ${META_CLIENT_USER_AGENT:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
      META_ADS_TOKEN: ${META_ADS_TOKEN:-}
      META_ADS_CONVERSIONS: ${META_ADS_CONVERSIONS:-}
      MICROSOFT_SANDBOX: ${MICROSOFT_SANDBOX:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_REFRESH_TOKEN: ${MICROSOFT_REFRESH_TOKEN:-}
      MICROSOFT_DEVELOPER_TOKEN: ${MICROSOFT_DEVELOPER_TOKEN:-}
      MICROSOFT_CUSTOMER_ID: ${MICROSOFT_CUSTOMER_ID:-}
      MICROSOFT_ACCOUNT_ID: ${MICROSOFT_ACCOUNT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      TIKTOK_PIXEL_CODE: ${TIKTOK_PIXEL_CODE:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_TEST_EVENT_CODE: ${TIKTOK_TEST_EVENT_CODE:-}
      TIKTOK_SITE_URL: ${TIKTOK_SITE_URL:-}

volumes:
  graph-data:

name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: docker build -t account-graph .

  # Looks for keys and tokens in every commit this one is built on. What it finds is not printed: the log is public.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      LOG: --full-history --diff-merges=first-parent HEAD
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      # A token made up here and now, put in by a merge, so that a scan which can find nothing does not pass.
      # The check asks for 7, so that no other failure is taken for a finding. A merge is read against its first parent: what was put in while merging is in neither branch.
      - name: find a planted token
        run: |
          git init -q -b main /tmp/planted
          cd /tmp/planted
          git config user.name ci
          git config user.email ci@example.org
          git commit -q --allow-empty -m one
          git switch -q -c side
          git commit -q --allow-empty -m two
          git switch -q main
          git merge -q --no-ff --no-commit side
          printf 'ghp_%s\n' "$(openssl rand -hex 18)" > token.txt
          git add token.txt
          git commit -q -m merged
          code=0
          /tmp/gitleaks git --redact --no-banner --exit-code 7 --log-opts="$LOG" . || code=$?
          test $code = 7
      - name: scan
        run: /tmp/gitleaks git --redact --no-banner --log-opts="$LOG" .

  # Runs beside the tests, against a server with nothing real in it. Fails on any finding of low severity or above.
  nuclei:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      GRAPH_TOKEN: ci-graph-token
      REVIEW_TOKENS: '{"ci":"ci-review-token"}'
      ORIGINS: http://localhost:3000
      LINK_SECRET: ci-link-secret-ci-link-secret-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # nuclei-templates v10.5.2, only the folders used below.
      - uses: actions/checkout@v4
        with:
          repository: projectdiscovery/nuclei-templates
          ref: 5442582a875f96887bfe403c6de562de460897e7
          path: templates
          sparse-checkout: |
            http/exposures
            http/misconfiguration
            http/vulnerabilities/generic
            dast
      - name: install nuclei
        run: |
          curl -sSfL -o nuclei.zip https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip
          echo 'ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6  nuclei.zip' | sha256sum -c -
          unzip -q nuclei.zip nuclei
      - run: npm ci
      - name: start the server with two linked accounts
        run: |
          node src/serve.ts > server.log 2>&1 &
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:8080/health; do sleep 0.5; done'
          curl -sSf http://127.0.0.1:8080/observe -H "authorization: Bearer $GRAPH_TOKEN" \
            -d "[{\"subject\":\"account:1\",\"identifiers\":[\"device:ci\",\"payment:ci\"],\"at\":$(date +%s)000},{\"subject\":\"account:2\",\"identifiers\":[\"device:ci\",\"payment:ci\"],\"at\":$(date +%s)000}]"
      # -nmhe: keep going after errors, so that a scan cannot pass by giving up on the server.
      - name: scan
        run: |
          flags='-s low,medium,high,critical -etags dos -no-stdin -duc -ni -nc -nmhe -retries 0 -timeout 3 -c 50 -rl 1000'
          ./nuclei -u http://127.0.0.1:8080 -t templates/http/exposures -t templates/http/misconfiguration -t templates/http/vulnerabilities/generic $flags -o root.txt
          ./nuclei -l .github/nuclei/urls.txt -t templates/dast -t .github/nuclei/server-error.yaml -dast -H "authorization: Bearer $GRAPH_TOKEN" $flags -o routes.txt
          curl -sSf http://127.0.0.1:8080/health
          if [ -s root.txt ] || [ -s routes.txt ]; then echo 'nuclei found something'; exit 1; fi
      - if: failure()
        run: tail -100 server.log

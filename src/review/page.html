<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account review</title>
<style>/* style.css */</style>
</head>
<body>
<a class="skip" href="#view">Skip to the page</a>
<header>
  <h1>Account review</h1>
  <nav id="views" aria-label="Views"></nav>
  <form id="find" class="row">
    <label>Find <input id="subject" placeholder="Find" size="24" list="found" autocomplete="off" required></label>
    <datalist id="found"></datalist>
    <button class="primary">Open</button>
    <button type="button" id="summon" title="Find or do"><kbd id="summon-key">Ctrl K</kbd></button>
  </form>
  <label id="token-label">Access token <input id="token" type="password" autocomplete="off" size="12"></label>
  <span id="who" class="row" hidden><span id="name"></span><button id="leave" type="button">Sign out</button></span>
</header>
<div id="notice" role="status"></div>
<main id="view" tabindex="-1"><p class="muted">Enter your access token.</p></main>
<footer><span id="fresh"></span><span id="zone"></span></footer>
<dialog id="ask">
  <form method="dialog">
    <h4 id="ask-title"></h4>
    <p id="ask-text" class="muted"></p>
    <div id="ask-effect" role="status"></div>
    <label id="ask-other-label" hidden>The other subject <input id="ask-other" autocomplete="off" placeholder="account:42"></label>
    <label>Reason, for the record <input id="ask-reason" autocomplete="off"></label>
    <p id="ask-problem" class="apart" role="alert"></p>
    <div class="row">
      <button value="yes" class="primary" id="ask-yes">Confirm</button>
      <button value="no" id="ask-no" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>
<script>/* scripts */</script>
</body>
</html>
